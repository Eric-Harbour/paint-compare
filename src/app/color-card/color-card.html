<body>
    <div [style.background-color]=selectedColor.hexCode class="ColorCardSection" appColorCardDirectiveTs>
        <p id="colorNumber">{{selectedColor.colorNumber}}</p>
        <p id="colorName">{{selectedColor.colorName}}</p>
        <p id="locationNumber">{{selectedColor.locationNumber}}</p>
        <p id="base-interior">{{selectedColor.interiorBase}}</p>
        <p id="base-exterior">{{selectedColor.exteriorBase}}</p>
        <p id="tinted-primer">{{selectedColor.tintedPrimer}}</p>
    </div>
    <div class="button-div">
        <button (click)="randomColor()">Random</button>
    </div>
</body>
<router-outlet></router-outlet>
