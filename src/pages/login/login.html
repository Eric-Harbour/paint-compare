<!DOCTYPE html>
<html lang="en">
    
    <head>
        <link rel="stylesheet" href="login.css">
        <script src="login.js" defer></script>
        <title></title>
    </head>
    <!-- What we need: banner, cut out for login area, option to sign up, option for forgot password-->
    <body>
        <header class="banner" height="50" width="50">
            <img class="banner-logo" src="../../images/paint-compare-logo.png">

        </header>

        <!-- Login Block -->
        <div class="login-parent-box">    
                <form id="login-form">
                    <div class="login-child-box">
                        <!-- Email input group -->
                        <div class="input-group">
                            <label id="email">Email</label>
                            <input type="email" id="email-input">
                        </div>

                        <!-- password input -->
                        <div class="input-group">
                            <label id="password">Password</label>
                            <input type="password" id="password-input">
                        </div>
                        <div class="input-group">
                            <input type="button" id="sign-in-button" value="Sign In" onclick="signIn()">
                        </div> 
                       
                    </div>
                </form>
            </div>
            
        </div> 
        
    </body>
</html>
